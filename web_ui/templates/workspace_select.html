{% extends "base.html" %}
{% block title %}ワークスペース選択 | YouTube 分析{% endblock %}
{% block content %}
<h2>ワークスペースを選択</h2>
<p>表示するワークスペースを選んでください。</p>
<form method="post" action="/workspaces/select" class="form-row">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div>
    <label for="workspace_id">表示するワークスペース</label>
    <select id="workspace_id" name="workspace_id" required>
      {% for workspace in workspaces %}
      <option value="{{ workspace.workspace_id }}">{{ workspace.name }}</option>
      {% endfor %}
    </select>
  </div>
  <button type="submit">表示する</button>
</form>
<details>
  <summary>新しいワークスペースを作成</summary>
  <form method="post" action="/workspaces">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="new_workspace_name">ワークスペース名</label>
    <input id="new_workspace_name" name="name" required maxlength="80">
    <p><button type="submit">作成する</button></p>
  </form>
</details>
{% endblock %}
