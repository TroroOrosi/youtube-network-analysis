<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<title>{% block title %}YouTube 分析{% endblock %}</title>
<link rel="stylesheet" href="/assets/workspace.css">
{% block head %}{% endblock %}
</head>
<body class="{% if session %}app-shell{% endif %}">
<a class="skip-link" href="#main-content">本文へ移動</a>
<header class="app-header">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true">Y</span><span>YouTube 分析<small>AUDIENCE INSIGHTS</small></span></a>
  {% if session %}
  <nav class="main-nav" aria-label="メインメニュー">
    <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>ホーム</a>
    <a href="/audience-network" {% if request.url.path == '/audience-network' %}aria-current="page"{% endif %}>視聴者ネットワーク</a>
    <a href="/compare" {% if request.url.path == '/compare' %}aria-current="page"{% endif %}>チャンネル比較</a>
    <a href="/#connections-heading" {% if request.url.path == '/analysis' or request.url.path == '/collecting' %}aria-current="page"{% endif %}>チャンネル・収集</a>
    <a href="/members" {% if request.url.path == '/members' %}aria-current="page"{% endif %}>メンバー管理</a>
  </nav>
  <form method="post" action="/logout" class="inline sign-out">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="secondary">ログアウト</button>
  </form>
  {% endif %}
</header>
<div class="app-body">
<main id="main-content" tabindex="-1">
  {% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
{% if session %}<footer class="limits">
  <p>登録者は「登録を公開している人」だけが取得できます。非公開の登録者は表示されません。</p>
</footer>{% endif %}
</div>
</body>
</html>
