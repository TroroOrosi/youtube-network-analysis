<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}YouTube 分析{% endblock %}</title>
<style>
:root { color-scheme: light; --gap: 1rem; }
body { font-family: system-ui, "Hiragino Sans", "Noto Sans JP", sans-serif;
       margin: 0; line-height: 1.7; color: #14171a; background: #fbfbfd; }
header, main, footer { max-width: 60rem; margin: 0 auto; padding: var(--gap); }
header { display: flex; flex-wrap: wrap; gap: var(--gap); align-items: baseline;
         justify-content: space-between; border-bottom: 1px solid #d5d8dc; }
h1 { font-size: 1.5rem; margin: 0; }
h2 { font-size: 1.2rem; margin-top: 2rem; }
a { color: #0b5cab; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible
  { outline: 3px solid #0b5cab; outline-offset: 2px; }
button { font: inherit; padding: 0.6rem 1rem; border-radius: 0.4rem;
         border: 1px solid #0b5cab; background: #0b5cab; color: #fff; cursor: pointer; }
button.secondary { background: #fff; color: #0b5cab; }
form.inline { display: inline; }
table { width: 100%; border-collapse: collapse; margin-top: var(--gap); }
th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #e3e6ea; }
.notice { background: #eaf4ff; border: 1px solid #b6d5f5; padding: 0.75rem;
          border-radius: 0.4rem; }
.cards { display: grid; gap: var(--gap);
         grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr)); }
.card { border: 1px solid #d5d8dc; border-radius: 0.5rem; padding: var(--gap);
        background: #fff; }
.card .value { font-size: 1.8rem; font-weight: 700; }
.limits { color: #4a5057; font-size: 0.9rem; }
label { display: block; margin-top: 0.75rem; font-weight: 600; }
input:not([type="checkbox"]), select { font: inherit; padding: 0.45rem;
                border-radius: 0.3rem; border: 1px solid #a6acb3; min-width: 12rem; }
input[type="checkbox"] { margin-right: 0.4rem; }
</style>
</head>
<body>
<header>
  <h1><a href="/">YouTube 分析</a></h1>
  {% if session %}
  <form method="post" action="/logout" class="inline">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit" class="secondary">ログアウト</button>
  </form>
  {% endif %}
</header>
<main>
  {% if message %}<p class="notice" role="status">{{ message }}</p>{% endif %}
  {% block content %}{% endblock %}
</main>
<footer class="limits">
  <p>登録者は「登録を公開している人」だけが取得できます。非公開の登録者は表示されません。</p>
</footer>
</body>
</html>
