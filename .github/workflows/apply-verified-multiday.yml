name: Apply verified multi-day collection repair (temporary)
on:
  push:
    branches: [fix/targeted-owner-content-recovery]
    paths: [.github/workflows/apply-verified-multiday.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'TroroOrosi/youtube-network-analysis' && github.ref == 'refs/heads/fix/targeted-owner-content-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact patch and restrict paths
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = ''.join(pathlib.Path(f'.agents/patches/multiday-{i:02}.b64').read_text().strip() for i in (1, 2))
          assert len(encoded) == 37104, len(encoded)
          patch = lzma.decompress(base64.b64decode(encoded, validate=True), memlimit=256*1024*1024)
          assert len(patch) == 104812, len(patch)
          assert hashlib.sha256(patch).hexdigest() == 'f82a9d0720cc13569861d77faf4647fd980402694659bd4c85e03c64316b4880'
          allowed = {
            '.github/workflows/export-runtime-review.yml', 'SPEC-collection-jobs.md',
            'channel_connections/errors.py', 'channel_connections/models.py',
            'channel_connections/ports.py', 'channel_connections/service.py',
            'collection_jobs/README.md', 'collection_jobs/service.py',
            'collection_jobs/tests/test_content.py', 'collection_jobs/tests/test_multiday.py',
            'collection_jobs/tests/test_persistence.py', 'collection_jobs/tests/test_policy.py',
            'docs/operations/multiday-collection.md', 'docs/operations/owner-content-recovery.md',
            'docs/superpowers/plans/2026-09-17-multiday-collection.md',
            'web_ui/README.md', 'web_ui/app.py', 'web_ui/google_provider.py',
            'web_ui/recover_owner_content.py', 'web_ui/requirements.txt',
            'web_ui/templates/analysis.html', 'web_ui/templates/dashboard.html',
            'web_ui/tests/test_google_provider.py', 'web_ui/tests/test_multiday_ui.py',
            'web_ui/tests/test_recovery_subscribers.py', 'web_ui/tests/test_subscriber_traversal.py',
            'web_ui/tests/test_web.py',
          }
          names = {line.split('\t', 2)[2] for line in subprocess.check_output(['git', 'apply', '--numstat'], input=patch).decode().splitlines()}
          assert names == allowed, names
          subprocess.run(['git', 'apply', '--check', '--index'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '--whitespace=error'], input=patch, check=True)
          print('Verified patch SHA256:', hashlib.sha256(patch).hexdigest())
          PY
      - name: Install full test dependencies
        run: python -m pip install -r web_ui/requirements-dev.txt -r subscriber_analytics/requirements.txt pytest openpyxl ruff
      - name: Full domain and web regression suite
        run: >-
          python -m pytest -q --import-mode=importlib analysis_api/tests channel_connections/tests
          channel_data/tests collection_jobs/tests subscriber_analytics/tests web_ui/tests workspace_access/tests
      - name: Verify portable IANA timezone fallback and daylight saving boundaries
        env:
          PYTHONTZPATH: ''
        run: >-
          python -m pytest -q --import-mode=importlib collection_jobs/tests/test_multiday.py
          -k provider_reset_is_pacific_midnight
      - name: Browser collection driver regressions
        run: node --test web_ui/tests/collecting.test.cjs
      - name: Compile and critical lint
        run: |
          python -m compileall -q web_ui collection_jobs channel_data channel_connections analysis_api workspace_access
          ruff check --select E9,F63,F7,F82 web_ui collection_jobs channel_connections
          git diff --cached --check
      - name: Commit verified repair without merging or deploying
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: persist every collection phase across daily quota resets'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/targeted-owner-content-recovery
          echo "Verified repair commit: $(git rev-parse HEAD)"
