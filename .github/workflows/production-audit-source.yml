name: Production integration (temporary)

on:
  push:
    branches: [fix/production-readiness-20260918]
    paths: [.github/workflows/production-audit-source.yml]

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/production-readiness-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Apply reviewed patch without production access
        run: python .production-readiness-patch.py
      - name: Install regression dependencies
        run: python -m pip install -q -r web_ui/requirements-dev.txt -r subscriber_analytics/requirements.txt pytest openpyxl ruff
      - name: Verify runtime and domain integration
        run: |
          python -m pytest -q --import-mode=importlib --ignore=web_ui/tests/test_production_release.py analysis_api/tests channel_connections/tests channel_data/tests collection_jobs/tests subscriber_analytics/tests web_ui/tests workspace_access/tests
          node --test web_ui/tests/collecting.test.cjs
          ruff check --select E9,F63,F7,F82 web_ui collection_jobs
          python -m compileall -q web_ui collection_jobs
      - name: Commit tested integration only to the work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web_ui/app.py web_ui/main.py collection_jobs/service.py Dockerfile
          git rm .production-readiness-patch.py
          git diff --cached --check
          git commit -m 'fix: resume existing collections and enforce hosted runtime safety'
          git push origin HEAD:refs/heads/fix/production-readiness-20260918
