name: Production audit source (temporary)

on:
  push:
    branches: [fix/production-readiness-20260918]
    paths: [.github/workflows/production-audit-source.yml]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect deployment source only
        run: |
          git ls-files '*AGENTS.md' '*CLAUDE.md' '*cloud*' '*deploy*' 'web_ui/*' 'scripts/*'
          for f in AGENTS.md web_ui/AGENTS.md Dockerfile web_ui/main.py web_ui/requirements.txt; do
            if [ -f "$f" ]; then printf '\n=== %s ===\n' "$f"; cat "$f"; fi
          done
      - name: Read-only unauthenticated production health
        run: |
          python - <<'PY'
          import datetime, json, urllib.request, urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          base = 'https://yna-web-893183842893.asia-northeast1.run.app'
          for path in ['/login', '/', '/healthz', '/readyz', '/internal/drain']:
              try:
                  r = opener.open(urllib.request.Request(base + path, headers={'User-Agent': 'YNA-production-readiness-read-only'}), timeout=30)
              except urllib.error.HTTPError as exc:
                  r = exc
              except urllib.error.URLError as exc:
                  print(json.dumps({'path': path, 'network_error': str(exc.reason)}))
                  continue
              print(json.dumps({'utc': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'path': path, 'status': r.code, 'headers': {k: r.headers.get(k) for k in ['location','content-type','x-content-type-options','x-frame-options','cache-control','x-yna-revision']}}))
              r.close()
          PY
