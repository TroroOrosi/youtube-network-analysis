name: Production integration (temporary)

on:
  push:
    branches: [fix/production-readiness-20260918]
    paths: [.github/workflows/production-audit-source.yml]

permissions:
  contents: write

jobs:
  integrate:
    if: github.ref == 'refs/heads/fix/production-readiness-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Reproduce release boundaries and apply exact-context fixes
        run: python .production-readiness-patch.py
      - name: Install regression dependencies
        run: python -m pip install -q -r web_ui/requirements-dev.txt -r subscriber_analytics/requirements.txt pytest openpyxl ruff
      - name: Verify all domain and operator regressions
        run: |
          python -m pytest -q --import-mode=importlib analysis_api/tests channel_connections/tests channel_data/tests collection_jobs/tests subscriber_analytics/tests web_ui/tests workspace_access/tests
          node --test web_ui/tests/collecting.test.cjs
          ruff check --select E9,F63,F7,F82 web_ui collection_jobs scripts/release_production.py
          python -m compileall -q web_ui collection_jobs scripts/release_production.py
      - name: Commit tested changes only to the work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/release_production.py web_ui/tests/test_production_release.py README.md web_ui/README.md
          git rm .production-readiness-patch.py
          git diff --cached --check
          git commit -m 'fix: detect release configuration drift and pause ambiguous scheduler resumes'
          git push origin HEAD:refs/heads/fix/production-readiness-20260918
