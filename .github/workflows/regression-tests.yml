name: Hosted application regression tests

on:
  push:
    branches: [main, fix/site-availability-large-channel-collection]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Anonymous production login diagnostic (no cookies or credentials)
        continue-on-error: true
        run: >-
          curl --silent --show-error --max-time 40 --output /dev/null
          --write-out 'Production login HTTP=%{http_code} seconds=%{time_total}\n'
          https://yna-web-893183842893.asia-northeast1.run.app/login
      - name: Install test dependencies
        run: >-
          python -m pip install -r web_ui/requirements-dev.txt
          -r subscriber_analytics/requirements.txt pytest pytest-subtests openpyxl ruff
      - name: Run domain and web tests
        run: >-
          python -m pytest -q --import-mode=importlib analysis_api/tests channel_connections/tests
          channel_data/tests collection_jobs/tests subscriber_analytics/tests
          web_ui/tests workspace_access/tests
      - name: Compile runtime modules
        run: python -m compileall -q web_ui collection_jobs channel_data channel_connections analysis_api workspace_access
