name: Hosted application regression tests

on:
  push:
    branches: [main, fix/site-availability-large-channel-collection]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: >-
          python -m pip install -q -r web_ui/requirements-dev.txt
          -r subscriber_analytics/requirements.txt pytest openpyxl ruff
      - name: Run domain and web tests
        run: >-
          python -m pytest -q --import-mode=importlib analysis_api/tests channel_connections/tests
          channel_data/tests collection_jobs/tests subscriber_analytics/tests
          web_ui/tests workspace_access/tests
      - name: Browser collection driver regressions
        run: node --test web_ui/tests/collecting.test.cjs
      - name: Compile runtime modules and check critical Python errors
        run: |
          python -m compileall -q web_ui collection_jobs channel_data channel_connections analysis_api workspace_access scripts/release_production.py
          ruff check --select E9,F63,F7,F82 web_ui collection_jobs scripts/release_production.py

  operator-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Cloud Shell tool without application dependencies or credentials
        run: |
          python -m unittest web_ui.tests.test_production_release -q
          python -m scripts.release_production --help

  container-smoke:
    needs: [tests, operator-tool]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stamp tested source into image, not runtime environment
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('web_ui/build_info.py').write_text('SOURCE_REVISION = ' + repr(os.environ['GITHUB_SHA']) + '\n')
          PY
      - name: Build actual production Dockerfile
        run: docker build --quiet -t yna-production-smoke .
      - name: Verify non-root image and real HTTP startup
        run: |
          docker run -d --name yna-smoke -p 127.0.0.1:18080:8080 yna-production-smoke
          trap 'docker rm -f yna-smoke >/dev/null 2>&1 || true' EXIT
          test "$(docker exec yna-smoke id -u)" != 0
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          for attempt in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:18080/health/ready', timeout=2) as reply:
                      body = json.load(reply)
                      assert reply.status == 200
                      assert body['source_revision'] == os.environ['GITHUB_SHA']
                      assert body['mode'] == 'demo'
                      assert body['scope'] == 'application_initialization'
                      assert reply.headers['cache-control'] == 'no-store'
                      break
              except (OSError, urllib.error.URLError):
                  time.sleep(1)
          else:
              raise SystemExit('Container never became ready')
          with urllib.request.urlopen('http://127.0.0.1:18080/login', timeout=5) as reply:
              assert reply.status == 200
          print('Docker: non-root startup, immutable source identity, ready and login passed')
          PY
      - name: Hosted startup must reject missing credentials and persistence
        run: |
          set +e
          timeout 20s docker run --rm -e K_SERVICE=yna-ci yna-production-smoke > /tmp/yna-startup-check.log 2>&1
          result=$?
          set -e
          test "$result" != 0
          test "$result" != 124
          grep -q 'Unsafe production configuration' /tmp/yna-startup-check.log
          echo 'Cloud Run environment: incomplete configuration fails closed'
